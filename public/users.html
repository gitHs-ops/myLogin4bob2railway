<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 목록</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .users-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .users-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .users-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .users-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .users-table th,
        .users-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .users-table th {
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }

        .users-table tbody tr:hover {
            background-color: #f5f5f5;
        }

        .users-table td {
            color: #555;
        }

        .no-users {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .button-group .btn {
            width: auto;
            padding: 12px 30px;
        }

        .user-count {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .users-container {
                padding: 10px;
            }

            .users-box {
                padding: 20px;
            }

            .users-table {
                font-size: 14px;
            }

            .users-table th,
            .users-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="users-container">
        <div class="users-box">
            <h1>📋 회원 목록</h1>
            <div class="user-count" id="userCount"></div>
            
            <div id="loadingMessage" class="loading">
                회원 목록을 불러오는 중...
            </div>

            <div id="tableContainer" style="display: none;">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>아이디</th>
                            <th>가입일시</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>

            <div id="noUsersMessage" class="no-users" style="display: none;">
                등록된 회원이 없습니다.
            </div>

            <div class="button-group">
                <button onclick="location.href='success.html'" class="btn">돌아가기</button>
                <button onclick="logout()" class="btn">로그아웃</button>
            </div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 로그인 상태 확인 및 회원 목록 불러오기
        async function loadUsers() {
            try {
                // 로그인 상태 확인
                const userResponse = await fetch('/api/current-user');
                const userData = await userResponse.json();
                
                if (!userData.loggedIn) {
                    window.location.href = 'login.html';
                    return;
                }

                // 회원 목록 불러오기
                const response = await fetch('/api/users');
                const data = await response.json();
                
                document.getElementById('loadingMessage').style.display = 'none';
                
                if (data.success && data.users.length > 0) {
                    displayUsers(data.users);
                } else {
                    document.getElementById('noUsersMessage').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('loadingMessage').textContent = '회원 목록을 불러오는데 실패했습니다.';
                document.getElementById('loadingMessage').style.color = '#dc3545';
            }
        }

        // 회원 목록 표시
        function displayUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            const tableContainer = document.getElementById('tableContainer');
            const userCount = document.getElementById('userCount');
            
            tbody.innerHTML = '';
            
            users.forEach((user, index) => {
                const row = document.createElement('tr');
                const createdDate = new Date(user.created_at);
                const formattedDate = createdDate.toLocaleString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${user.username}</strong></td>
                    <td>${formattedDate}</td>
                `;
                
                tbody.appendChild(row);
            });
            
            userCount.textContent = `총 ${users.length}명의 회원이 등록되어 있습니다.`;
            tableContainer.style.display = 'block';
        }

        // 로그아웃
        async function logout() {
            try {
                await fetch('/api/logout', {
                    method: 'POST'
                });
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error logging out:', error);
            }
        }

        // 페이지 로드 시 실행
        loadUsers();
    </script>
</body>
</html>
